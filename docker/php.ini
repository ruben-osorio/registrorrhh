; Configuración PHP para el contenedor (Railway).

; Capa de compatibilidad PHP 5 -> 8 (mysql_*, each, ereg, etc.)
auto_prepend_file = /var/www/html/compat.php

; El código legado envía cabeceras después de generar salida
output_buffering = 4096

; Producción: no mostrar errores, registrarlos en los logs de Railway
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_WARNING & ~E_NOTICE & ~E_DEPRECATED

short_open_tag = Off
expose_php = Off
date.timezone = America/La_Paz

memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120

session.cookie_httponly = 1
session.use_strict_mode = 1
